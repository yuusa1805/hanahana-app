<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キングハナハナ 設定推定（閉店後）</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  font-size: 18px;
  padding: 10px;
  margin-top: 4px;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #4caf50;
  color: white;
}

.result {
  margin-top: 16px;
  line-height: 1.6;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>キングハナハナ<br>設定推定（閉店後）</h1>

<div class="card">
  <label>台番号</label>
  <input id="machine" type="number">

  <label>総回転数（G）</label>
  <input id="games" type="number">

  <label>BB回数</label>
  <input id="bb" type="number">

  <label>RB回数</label>
  <input id="rb" type="number">

  <button onclick="analyze()">判定する</button>

  <div id="result" class="result"></div>
</div>

<script>
// ===== 設定データ（キングハナハナ） =====
const settings = [
  { s:1, g:183, rb:273 },
  { s:2, g:172, rb:256 },
  { s:3, g:163, rb:240 },
  { s:4, g:154, rb:224 },
  { s:5, g:145, rb:208 },
  { s:6, g:136, rb:192 }
];

// ===== メイン処理 =====
function analyze() {
  const machine = document.getElementById("machine").value;
  const games = Number(document.getElementById("games").value);
  const bb = Number(document.getElementById("bb").value);
  const rb = Number(document.getElementById("rb").value);

  if (!games || (bb + rb) === 0) {
    alert("データを正しく入力してね");
    return;
  }

  const total = bb + rb;
  const gassan = games / total;
  const rbRate = rb > 0 ? games / rb : Infinity;

  // --- 推定設定（合算のみ） ---
  let est = settings[0];
  let diff = Math.abs(gassan - est.g);

  settings.forEach(s => {
    const d = Math.abs(gassan - s.g);
    if (d < diff) {
      diff = d;
      est = s;
    }
  });

  // --- 信頼度（ゲーム数のみ） ---
  const trustPercent = Math.min(games / 8000 * 100, 100);
  const stars =
    trustPercent >= 80 ? "★★★★★" :
    trustPercent >= 65 ? "★★★★☆" :
    trustPercent >= 50 ? "★★★☆☆" :
    trustPercent >= 35 ? "★★☆☆☆" :
                         "★☆☆☆☆";

  // --- REG評価（記号） ---
  let regMark = "✕✕";
  if (rb > 0) {
    const ratio = est.rb / rbRate;
    if (ratio >= 1.0) regMark = "◎";
    else if (ratio >= 0.85) regMark = "○";
    else if (ratio >= 0.70) regMark = "△";
    else if (ratio >= 0.55) regMark = "×";
  }

  // --- 表示 ---
  document.getElementById("result").innerHTML = `
  台番号：${machine}<br>
  総回転数：${games}G<br>
  BB：${bb} / RB：${rb}<br><br>

  合算：1/${gassan.toFixed(1)}<br>
  推定設定：${est.s}<br>
  信頼度：${stars}<br>
  REG評価：${regMark}
  `;
}
</script>

</body>
</html>
