<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キングハナハナ 設定推定（閉店後）</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input, select {
  width: 100%;
  font-size: 18px;
  padding: 10px;
  margin-top: 4px;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #4caf50;
  color: white;
}

.list {
  margin-top: 16px;
}

.item {
  background: #fff;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 15px;
}

.delete {
  margin-top: 6px;
  background: #f44336;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>キングハナハナ<br>設定推定（閉店後）</h1>

<div class="card">
  <label>日付</label>
  <input id="date" type="date">

  <label>台番号</label>
  <input id="machine" type="number">

  <label>総回転数（G）</label>
  <input id="games" type="number">

  <label>BB回数</label>
  <input id="bb" type="number">

  <label>RB回数</label>
  <input id="rb" type="number">

  <button onclick="saveData()">保存する</button>
</div>

<div class="card">
  <label>表示する日付</label>
  <select id="filterDate" onchange="render()">
    <option value="">すべて表示</option>
  </select>

  <label>並び順</label>
  <select id="sortType" onchange="render()">
    <option value="machine">台番号順</option>
    <option value="setting">設定順</option>
  </select>
</div>

<div class="list" id="list"></div>

<script>
// ===== 設定データ =====
const SETTINGS = [
  { s:1, g:183, rb:273 },
  { s:2, g:172, rb:256 },
  { s:3, g:163, rb:240 },
  { s:4, g:154, rb:224 },
  { s:5, g:145, rb:208 },
  { s:6, g:136, rb:192 }
];

let data = JSON.parse(localStorage.getItem("hanaData")) || [];

// ===== 保存 =====
function saveData() {
  const date = document.getElementById("date").value;
  const machine = Number(document.getElementById("machine").value);
  const games = Number(document.getElementById("games").value);
  const bb = Number(document.getElementById("bb").value);
  const rb = Number(document.getElementById("rb").value);

  if (!date || !machine || !games) {
    alert("日付・台番号・回転数は必須だよ");
    return;
  }

  const total = bb + rb;
  const gassan = games / total;

  // 推定設定（合算のみ）
  let est = SETTINGS[0];
  let diff = Math.abs(gassan - est.g);
  SETTINGS.forEach(s => {
    const d = Math.abs(gassan - s.g);
    if (d < diff) {
      diff = d;
      est = s;
    }
  });

  // 信頼度（★）
  const trust = Math.min(games / 8000 * 100, 100);
  const stars =
    trust >= 80 ? "★★★★★" :
    trust >= 65 ? "★★★★☆" :
    trust >= 50 ? "★★★☆☆" :
    trust >= 35 ? "★★☆☆☆" :
                  "★☆☆☆☆";

  // REG評価
  let reg = "✕✕";
  if (rb > 0) {
    const ratio = est.rb / (games / rb);
    if (ratio >= 1.0) reg = "◎";
    else if (ratio >= 0.85) reg = "○";
    else if (ratio >= 0.70) reg = "△";
    else if (ratio >= 0.55) reg = "×";
  }

  data.push({
    date, machine, games, bb, rb,
    est: est.s,
    gassan: gassan.toFixed(1),
    stars, reg
  });

  localStorage.setItem("hanaData", JSON.stringify(data));
  updateDateFilter();
  render();
}

// ===== 日付フィルタ更新 =====
function updateDateFilter() {
  const select = document.getElementById("filterDate");
  const dates = [...new Set(data.map(d => d.date))];

  select.innerHTML = `<option value="">すべて表示</option>`;
  dates.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    select.appendChild(opt);
  });
}

// ===== 表示 =====
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  const filterDate = document.getElementById("filterDate").value;
  const sortType = document.getElementById("sortType").value;

  let view = data.slice();

  // 日付フィルタ
  if (filterDate) {
    view = view.filter(d => d.date === filterDate);
  }

  // 並び替え
  if (sortType === "machine") {
    view.sort((a, b) => a.machine - b.machine);
  } else {
    view.sort((a, b) => b.est - a.est);
  }

  view.forEach((d, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      📅 ${d.date} / 台 ${d.machine}<br>
      ${d.games}G BB:${d.bb} RB:${d.rb}<br>
      合算 1/${d.gassan}｜設定${d.est}<br>
      信頼度 ${d.stars}｜REG ${d.reg}
      <button class="delete" onclick="removeData(${i})">削除</button>
    `;
    list.appendChild(div);
  });
}

// ===== 削除 =====
function removeData(index) {
  data.splice(index, 1);
  localStorage.setItem("hanaData", JSON.stringify(data));
  updateDateFilter();
  render();
}

updateDateFilter();
render();
</script>

</body>
</html>
